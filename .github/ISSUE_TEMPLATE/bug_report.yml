name: Bug report
description: Report a reproducible problem in Mailshift
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include email addresses, account names, passwords, one-time codes, recovery codes, vault backups, or screenshots containing private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem without including private account data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 128, Chrome 127, Safari 18
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - GitHub Pages browser app
        - Local development build
        - Local production build
        - Other self-hosted build
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private account data and secrets from this report.
          required: true
